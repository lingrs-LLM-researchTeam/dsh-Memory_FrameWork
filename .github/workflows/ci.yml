name: DSH memory checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest dsh/tests -q
      - run: python -m build --wheel --no-isolation
      - run: python tools/check_distribution.py
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dsh/plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
